name: Bug report
description: Report a reproducible problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. Do not include passwords, API keys, private files, recordings, or other personal data.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and version, operating system, device, and relevant runtime version.
      placeholder: Edge 140 on Windows 11, Node 24
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Give the smallest exact sequence that reproduces the problem.
      placeholder: "1. Open ...
2. Select ...
3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or screenshots
      description: Remove secrets and personal information before attaching anything.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed secrets and personal information.
          required: true
