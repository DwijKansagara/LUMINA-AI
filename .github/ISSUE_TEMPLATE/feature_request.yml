name: Focused improvement
description: Suggest a concrete, testable improvement
title: "[Idea] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or technical limitation would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request is specific to this project and does not rely on fabricated claims or unlicensed assets.
          required: true
